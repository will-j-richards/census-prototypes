[build]
  command = "yarn build"
  publish = "build"
  functions = "netlify"

[build.environment]
  NODE_VERSION = "20"
  # Needed so Netlify can install the git dependency (@ons/prototype-kit)
  YARN_ENABLE_IMMUTABLE_INSTALLS = "false"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/send-access-code"
  to = "/.netlify/functions/send-access-code"
  status = 200
  force = true
